name: Publish Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only, do not publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # The same editors the test workflow caches, so a release does not download them again.
      - uses: actions/cache@v6
        with:
          path: |
            .vscode-test
            .vscode-test-web
          key: editors-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: editors-${{ runner.os }}-

      - name: Verify package.json version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "release tag : $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - run: npm run typecheck

      # Kept, unlike in test.yml: `vsce package` below needs dist/, and a release must not depend on
      # a test script having produced it as a side effect.
      - run: npm run build

      - run: npm test

      - name: Integration tests, VS Code Web
        run: npm run test:integration

      # Linux has no display, so running desktop VS Code needs xvfb.
      - name: Integration tests, desktop VS Code
        run: xvfb-run -a npm run test:integration:desktop

      # Name and version from package.json; on release the check above matches the version to the tag.
      # The compiler makes this a large VSIX, so its size is on the record for every run.
      - name: Package VSIX
        run: |
          VSIX_NAME="$(node -p "require('./package.json').name")-$(node -p "require('./package.json').version").vsix"
          npx --yes @vscode/vsce package --out "$VSIX_NAME"
          ls -l "$VSIX_NAME"
          echo "VSIX_NAME=$VSIX_NAME" >> "$GITHUB_ENV"

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: bbcmicrobit-cpp-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Upload VSIX to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$VSIX_NAME" --clobber

      # `github.event.inputs` is always a string, where `inputs` is typed from the
      # UI and a string over the API. Comparing strings behaves the same either way.
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'release' || github.event.inputs.dry_run == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath "$VSIX_NAME"

      - name: Publish to Open VSX Registry
        if: github.event_name == 'release' || github.event.inputs.dry_run == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish --packagePath "$VSIX_NAME"
