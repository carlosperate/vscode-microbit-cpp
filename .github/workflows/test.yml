name: Build and Test

on:
  push:
    # "**" and not "*", which stops at a slash and would skip feature/… branches.
    branches: "**"
  pull_request:
    branches: "**"

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          # Linux has no display, so running desktop VS Code needs xvfb.
          - os: ubuntu-latest
            xvfb: xvfb-run -a
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # Both integration runs download an editor, about 1 GB unpacked between them, and every job
      # in the matrix would otherwise fetch its own copy.
      - uses: actions/cache@v4
        with:
          path: |
            .vscode-test
            .vscode-test-web
          key: editors-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: editors-${{ runner.os }}-

      - run: npm run typecheck

      # No build step of its own: the unit tests build into a temp directory and each integration
      # script builds first, so a broken build still fails the job, three times over rather than four.
      - run: npm test

      - name: Integration tests, VS Code Web
        run: npm run test:integration

      - name: Integration tests, desktop VS Code
        run: ${{ matrix.xvfb }} npm run test:integration:desktop
